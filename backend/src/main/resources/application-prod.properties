# Production requires these environment variables. Do not commit real credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hackathon default: create and evolve the schema automatically.
# For a long-running service, introduce migrations and change this to validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.application.name=easy-transfer

# Render injects PORT at runtime. The fallback keeps local execution on 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# The API is public and is consumed by Expo web previews whose origin can vary
# (deployed domain, localhost, or a LAN address). Production can still restrict
# this with a comma-separated CORS_ALLOWED_ORIGINS value.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.graph.location=classpath:graph/seoul-station/map-v1.json

# Gates PATCH /api/v1/admin/maps/{mapId}/graph (X-Admin-Key header). Blank by
# default, which rejects every request — set ADMIN_KEY to enable the editor's
# save action. Internal tool only; never expose this on a public deployment
# without also restricting network access to it.
app.admin.key=${ADMIN_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

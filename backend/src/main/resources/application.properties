spring.application.name=easy-transfer

# Render injects PORT at runtime. The fallback keeps local execution on 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.graph.location=classpath:graph/seoul-station/map-v1.json

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

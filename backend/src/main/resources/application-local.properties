# Local development settings. Values are loaded from ../.env when present.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

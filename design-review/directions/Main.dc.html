<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #3366FF; }
  a:hover { color: #2B54D6; }
</style>
</helmet>
<div style="width:390px; height:844px; background:#06203C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px;">
    <button style="width:32px; height:32px; border-radius:4px; background:rgba(255,255,255,0.14); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
    </button>
    <span style="font-size:12px; font-weight:800; letter-spacing:1.2px; color:rgba(255,255,255,0.6);">AREX PLATFORM</span>
    <div style="width:32px;"></div>
  </div>

  <div style="display:flex; gap:4px; padding:8px 20px 16px;">
    <span style="flex:1; height:6px; background:#FFD200;"></span>
    <span style="flex:1; height:6px; background:#FFD200;"></span>
    <span style="flex:1; height:6px; background:rgba(255,255,255,0.2);"></span>
  </div>

  <div style="margin:0 20px; background:#0A2E52; padding:24px 20px; display:flex; align-items:center; gap:20px;">
    <svg width="88" height="88" viewBox="0 0 64 64" style="flex-shrink:0;">
      <path d="M 44 58 L 44 30 C 44 24 40 22 34 22 L 22 22" stroke="#FFFFFF" stroke-width="9" fill="none" />
      <polygon points="24 8 24 36 6 22" fill="#FFFFFF" />
    </svg>
    <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
      <span style="font-size:56px; font-weight:800; letter-spacing:-2px; color:#FFFFFF; line-height:1;">18<span style="font-size:26px; font-weight:700; letter-spacing:-0.5px;">m</span></span>
      <span style="font-size:20px; font-weight:800; letter-spacing:1px; color:#FFD200;">TURN LEFT</span>
    </div>
  </div>

  <div style="display:flex; gap:8px; padding:16px 20px 0;">
    <span style="background:#0090D2; color:#FFFFFF; font-size:13px; font-weight:800; letter-spacing:0.6px; padding:8px 12px;">AREX</span>
    <span style="background:rgba(255,255,255,0.14); color:#FFFFFF; font-size:13px; font-weight:800; letter-spacing:0.6px; padding:8px 12px;">FLOOR 1F</span>
    <span style="background:rgba(255,255,255,0.14); color:rgba(255,255,255,0.75); font-size:13px; font-weight:800; letter-spacing:0.6px; padding:8px 12px;">2 / 3</span>
  </div>

  <div style="padding:16px 20px 0;">
    <p style="margin:0; font-size:21px; font-weight:600; line-height:29px; color:#FFFFFF;">Turn left and walk 18 meters to Elevator A.</p>
  </div>

  <div style="margin:16px 20px 0; background:#0A2E52; padding:14px 16px; display:flex; flex-direction:column; gap:4px;">
    <span style="font-size:11px; font-weight:800; letter-spacing:1px; color:#FFD200;">LOOK FOR</span>
    <span style="font-size:15px; font-weight:700; color:#FFFFFF;">Elevator A</span>
    <span style="font-size:13px; line-height:19px; color:rgba(255,255,255,0.65);">A silver elevator next to the information desk.</span>
  </div>

  <div style="margin:16px 20px 0; height:150px; background:#041A31; position:relative; overflow:hidden;">
    <svg width="100%" height="100%" viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="0" width="320" height="150" fill="#041A31" />
      <rect x="20" y="104" width="210" height="20" fill="#0A2E52" />
      <rect x="150" y="18" width="20" height="100" fill="#0A2E52" />
      <path d="M 34 114 L 160 114 L 160 40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 34 114 L 160 114 L 160 40" fill="none" stroke="#3366FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" />
      <circle cx="160" cy="40" r="7" fill="#3366FF" stroke="#FFFFFF" stroke-width="3" />
    </svg>
  </div>

  <div style="margin-top:auto; padding:16px 20px 28px; display:flex; gap:10px;">
    <button style="width:56px; height:56px; border:none; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    </button>
    <button style="flex:1; height:56px; border:none; background:#FFD200; color:#06203C; font-size:17px; font-weight:800; letter-spacing:0.4px; cursor:pointer; font-family:inherit;">NEXT STEP</button>
  </div>

</div>
</x-dc>
</body>
</html>

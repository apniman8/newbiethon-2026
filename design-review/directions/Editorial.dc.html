<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #3366FF; }
  a:hover { color: #2B54D6; }
</style>
</helmet>
<div style="width:390px; height:844px; background:#FAF7F2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 28px 0;">
    <button style="width:32px; height:32px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7F72" stroke-width="1.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
    </button>
    <span style="font-size:11px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:#8A7F72;">Two of three</span>
    <div style="width:32px;"></div>
  </div>

  <div style="padding:44px 28px 0; display:flex; flex-direction:column; gap:20px;">
    <div style="display:flex; align-items:baseline; gap:14px;">
      <svg width="40" height="40" viewBox="0 0 64 64" style="flex-shrink:0; align-self:center;">
        <path d="M 44 58 L 44 30 C 44 24 40 22 34 22 L 22 22" stroke="#1A1714" stroke-width="6" fill="none" />
        <polygon points="24 10 24 34 8 22" fill="#1A1714" />
      </svg>
      <span style="font-family:'Instrument Serif','Iowan Old Style',Georgia,serif; font-size:76px; line-height:1; color:#1A1714;">18<span style="font-size:30px; color:#8A7F72;"> m</span></span>
    </div>

    <h1 style="margin:0; font-family:'Instrument Serif','Iowan Old Style',Georgia,serif; font-size:38px; font-weight:400; line-height:44px; color:#1A1714; text-wrap:pretty;">Turn left, then walk to Elevator A.</h1>

    <div style="height:1px; background:#E4DCD0;"></div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:11px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:#8A7F72;">What you'll see</span>
      <p style="margin:0; font-size:16px; line-height:25px; color:#4A423A; text-wrap:pretty;">A silver elevator next to the information desk. You are still on the first floor.</p>
    </div>
  </div>

  <div style="margin:28px 28px 0; height:190px; border-radius:6px; overflow:hidden; background:#F0EAE0;">
    <svg width="100%" height="100%" viewBox="0 0 334 190" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="0" width="334" height="190" fill="#F0EAE0" />
      <rect x="20" y="128" width="220" height="18" fill="#E0D6C6" />
      <rect x="158" y="30" width="18" height="112" fill="#E0D6C6" />
      <path d="M 34 137 L 167 137 L 167 52" fill="none" stroke="#1A1714" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" />
      <circle cx="167" cy="52" r="6" fill="#3366FF" />
    </svg>
  </div>

  <div style="margin-top:auto; padding:24px 28px 36px; display:flex; align-items:center; gap:20px;">
    <button style="width:52px; height:52px; border:1px solid #D9CFC0; border-radius:26px; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7F72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    </button>
    <button style="flex:1; height:52px; border:none; border-radius:26px; background:#1A1714; color:#FAF7F2; font-size:16px; font-weight:600; letter-spacing:0.2px; cursor:pointer; font-family:inherit;">Next step</button>
  </div>

</div>
</x-dc>
</body>
</html>

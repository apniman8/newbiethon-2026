<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #3366FF; }
  a:hover { color: #2B54D6; }
</style>
</helmet>
<div style="width:390px; height:844px; background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; gap:12px; padding:16px 20px 12px; border-bottom:1px solid #E8EBF0;">
    <button style="width:36px; height:36px; border-radius:18px; background:#F2F4F7; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
    </button>
    <div style="display:flex; flex-direction:column; gap:1px; min-width:0;">
      <span style="font-size:15px; font-weight:700; color:#111418;">To AREX Platform</span>
      <span style="font-size:12px; font-weight:500; color:#6B7280;">1 of 3 done · 213 m left</span>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; padding:16px 20px; gap:10px; overflow:hidden;">

    <div style="display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border-radius:14px; background:#F2F4F7;">
      <span style="width:26px; height:26px; border-radius:13px; background:#00BF40; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
      </span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:15px; font-weight:600; color:#6B7280; text-decoration:line-through;">Go straight 35 m toward the AREX signs</span>
        <span style="font-size:12px; font-weight:600; color:#9AA1AC;">WALK · 1F</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px; padding:18px; border-radius:16px; border:2px solid #3366FF; background:#FFFFFF;">
      <div style="display:flex; gap:14px; align-items:center;">
        <svg width="48" height="48" viewBox="0 0 64 64" style="flex-shrink:0;">
          <path d="M 44 58 L 44 30 C 44 24 40 22 34 22 L 22 22" stroke="#3366FF" stroke-width="9" fill="none" />
          <polygon points="24 8 24 36 6 22" fill="#3366FF" />
        </svg>
        <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
          <span style="font-size:12px; font-weight:700; letter-spacing:0.6px; color:#3366FF;">STEP 2 — NOW</span>
          <span style="font-size:24px; font-weight:700; letter-spacing:-0.5px; color:#111418;">Turn left · 18 m</span>
        </div>
      </div>

      <p style="margin:0; font-size:16px; line-height:23px; color:#4B5563; text-wrap:pretty;">Walk 18 meters to Elevator A — silver, next to the information desk.</p>

      <div style="height:120px; border-radius:12px; overflow:hidden; background:#F2F4F7;">
        <svg width="100%" height="100%" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="300" height="120" fill="#F2F4F7" />
          <rect x="16" y="82" width="200" height="16" fill="#E2E6EC" />
          <rect x="140" y="18" width="16" height="72" fill="#E2E6EC" />
          <path d="M 28 90 L 148 90 L 148 38" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 28 90 L 148 90 L 148 38" fill="none" stroke="#3366FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" />
          <circle cx="148" cy="38" r="7" fill="#3366FF" stroke="#FFFFFF" stroke-width="3" />
        </svg>
      </div>

      <button style="width:100%; height:52px; border:none; border-radius:14px; background:#3366FF; color:#FFFFFF; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit;">I'm at the elevator</button>
    </div>

    <div style="display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border-radius:14px; border:1px solid #E8EBF0;">
      <span style="width:26px; height:26px; border-radius:13px; border:1.5px solid #D7DBE2; color:#9AA1AC; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">3</span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:15px; font-weight:600; color:#111418;">Take Elevator A down to B7</span>
        <span style="font-size:12px; font-weight:600; color:#9AA1AC;">ELEVATOR · 1F → B7</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>

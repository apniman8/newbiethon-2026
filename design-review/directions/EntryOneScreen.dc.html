<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #3366FF; }
  a:hover { color: #2B54D6; }
</style>
</helmet>
<div style="width:390px; height:844px; background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:28px 24px 0; display:flex; flex-direction:column; gap:6px;">
    <span style="font-size:13px; font-weight:600; color:#3366FF;">SEOUL STATION</span>
    <h1 style="margin:0; font-size:28px; font-weight:700; line-height:35px; letter-spacing:-0.6px; color:#111418;">Plan your walk<br />inside the station</h1>
  </div>

  <div style="margin:24px 24px 0; border:1px solid #E8EBF0; border-radius:16px; position:relative;">
    <div style="display:flex; align-items:center; gap:14px; padding:18px 56px 18px 18px;">
      <span style="width:10px; height:10px; border-radius:5px; background:#3366FF; flex-shrink:0;"></span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:11px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">From</span>
        <span style="font-size:16px; font-weight:600; color:#111418;">Seoul Station · Exit 1</span>
      </div>
    </div>

    <div style="height:1px; background:#E8EBF0; margin-left:42px;"></div>

    <div style="display:flex; align-items:center; gap:14px; padding:18px 56px 18px 18px;">
      <span style="width:10px; height:10px; border-radius:2px; background:#111418; flex-shrink:0;"></span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:11px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">To</span>
        <span style="font-size:16px; font-weight:600; color:#9AA1AC;">Pick a platform</span>
      </div>
    </div>

    <button style="position:absolute; right:14px; top:50%; margin-top:-22px; width:44px; height:44px; border-radius:22px; border:1px solid #E8EBF0; background:#FFFFFF; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 4 21 8 17 12" /><line x1="21" y1="8" x2="7" y2="8" /><polyline points="7 20 3 16 7 12" /><line x1="3" y1="16" x2="17" y2="16" /></svg>
    </button>
  </div>

  <div style="padding:24px 24px 0; display:flex; flex-direction:column; gap:10px; flex:1;">
    <span style="font-size:13px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">Inside the gates</span>

    <button style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:14px; border:1px solid #E8EBF0; background:transparent; cursor:pointer; font-family:inherit; text-align:left; width:100%;">
      <span style="display:flex; flex-direction:column; gap:3px; min-width:0;">
        <span style="font-size:16px; font-weight:600; color:#111418;">AREX Platform</span>
        <span style="font-size:13px; color:#6B7280;">Airport Railroad · B7</span>
      </span>
      <span style="font-size:12px; font-weight:700; color:#FFFFFF; background:#0090D2; padding:5px 9px; border-radius:6px; flex-shrink:0;">AREX</span>
    </button>

    <button style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:14px; border:1px solid #E8EBF0; background:transparent; cursor:pointer; font-family:inherit; text-align:left; width:100%;">
      <span style="display:flex; flex-direction:column; gap:3px; min-width:0;">
        <span style="font-size:16px; font-weight:600; color:#111418;">Line 1 Platform</span>
        <span style="font-size:13px; color:#6B7280;">Toward Cheonan · Incheon · B2</span>
      </span>
      <span style="font-size:12px; font-weight:700; color:#FFFFFF; background:#0052A4; padding:5px 9px; border-radius:6px; flex-shrink:0;">1</span>
    </button>

    <button style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px; border:1px dashed #D7DBE2; background:transparent; cursor:pointer; font-family:inherit; width:100%;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
      <span style="font-size:15px; font-weight:600; color:#6B7280;">Search somewhere else</span>
    </button>
  </div>

  <div style="padding:16px 24px 32px;">
    <button style="width:100%; height:56px; border:none; border-radius:14px; background:#3366FF; color:#FFFFFF; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; opacity:0.45;">Find my way</button>
  </div>

</div>
</x-dc>
</body>
</html>

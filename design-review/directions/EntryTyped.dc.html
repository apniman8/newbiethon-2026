<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #3366FF; }
  a:hover { color: #2B54D6; }
</style>
</helmet>
<div style="width:390px; height:844px; background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; gap:12px; padding:14px 24px 4px;">
    <button style="width:36px; height:36px; border-radius:18px; background:#F2F4F7; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    </button>
    <span style="font-size:17px; font-weight:700; color:#111418;">Destination</span>
  </div>

  <div style="padding:8px 24px 0; display:flex; flex-direction:column; gap:20px; flex:1;">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:13px; font-weight:600; color:#3366FF;">STEP 2 OF 2</span>
      <h1 style="margin:0; font-size:28px; font-weight:700; line-height:35px; letter-spacing:-0.6px; color:#111418;">Where are you<br />heading?</h1>
    </div>

    <div style="display:flex; align-items:center; gap:12px; padding:16px; border-radius:16px; background:#F2F4F7;">
      <span style="width:10px; height:10px; border-radius:5px; background:#3366FF; flex-shrink:0;"></span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:11px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">From</span>
        <span style="font-size:15px; font-weight:600; color:#111418;">Seoul Station · Exit 1</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <span style="font-size:13px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">Destination</span>
      <div style="position:relative;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:14px; top:17px;"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        <div style="width:100%; height:52px; border-radius:12px; border:2px solid #3366FF; padding:0 16px 0 40px; font-size:16px; font-weight:500; color:#111418; display:flex; align-items:center;">are</div>
      </div>

      <div style="display:flex; flex-direction:column; border:1px solid #E8EBF0; border-radius:12px; overflow:hidden;">
        <div style="display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-bottom:1px solid #E8EBF0;">
          <span style="font-size:15px; font-weight:600; color:#111418;">AREX Platform</span>
          <span style="font-size:12px; color:#6B7280;">Airport Railroad, B7</span>
        </div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <span style="font-size:13px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6B7280;">Traveling with luggage?</span>
      <div style="display:flex; gap:8px;">
        <span style="flex:1; height:44px; border-radius:12px; border:1px solid #E8EBF0; color:#4B5563; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;">Standard</span>
        <span style="flex:1; height:44px; border-radius:12px; background:#111418; color:#FFFFFF; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;">With luggage</span>
      </div>
    </div>
  </div>

  <div style="padding:16px 24px 32px;">
    <button style="width:100%; height:56px; border:none; border-radius:14px; background:#3366FF; color:#FFFFFF; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit;">Find my way</button>
  </div>

</div>
</x-dc>
</body>
</html>
